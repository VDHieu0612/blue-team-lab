# Nginx Reverse Proxy + ModSecurity WAF Configuration
# Blue Team Lab - NT204 Group 07
# Reference configuration

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ModSecurity WAF
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Logging
    log_format security '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log security;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 443 ssl;
        server_name lab.internal;

        # TLS Termination
        ssl_certificate     /etc/ssl/certs/lab.crt;
        ssl_certificate_key /etc/ssl/private/lab.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Rate limit on API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_servers;
        }

        location / {
            proxy_pass         http://backend_servers;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # Backend servers (load balanced)
    upstream backend_servers {
        server 192.168.30.10:80;
        server 192.168.30.11:80 backup;
    }
}
